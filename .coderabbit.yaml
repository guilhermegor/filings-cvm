# CodeRabbit configuration.
#
# ⚠️ VALIDATE AGAINST THE SCHEMA, NOT THE DOCS PAGE:
#   https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# The docs reference lists `pre_merge_checks` as its own section, which reads as top-level — it
# is not, it lives under `reviews`, and shipping it at the top level made CodeRabbit ignore the
# block WHOLE while every gate here stayed green (#222). A documentation page confirms that a
# name EXISTS; it does not tell you WHERE it is accepted. Same shape as #217, where a real
# webhook event was not a valid workflow trigger. Re-validate this file against the schema after
# any edit.
#
# Three jobs:
#
# 1. `knowledge_base.code_guidelines` — point the bot at the CLAUDE.md files themselves, so the
#    house conventions have ONE home and cannot drift from a copy pasted in here.
# 2. `path_instructions` — restate only what is CRITICAL and path-scoped, where being wrong is
#    expensive. Deliberate redundancy, not duplication for its own sake.
# 3. `tools` — decide, per linter, whether we already own that gate.
#
# ⚠️ EVERY BEHAVIOURAL KEY IS PINNED, INCLUDING THE ONES THAT MATCH TODAY'S DEFAULT, and each
# carries `(default: X)`. A default that flips server-side changes what happens here without a
# commit — and this repo has been bitten three times in two days by "the thing I verified was
# not the thing that decides". The file is the truth; the annotation makes a future drift
# visible as a diff against reality rather than a silent behaviour change.
# ⚠️ THE TOOLS SECTION IS AN AUDIT, NEVER A BLANKET DISABLE. The rule people get half-right is
# "disable the bot's linters that duplicate yours" — true, because two sources of truth for one
# rule drift and double-report. The other half is what this repo learned the hard way: a linter
# the bot runs AND WE DO NOT HAVE is not noise, it is evidence of a MISSING GATE. That is
# literally how `actionlint` got here — CodeRabbit ran it, we did not, and it caught a workflow
# GitHub rejected outright while every local hook was green (#217 → #218). So each entry below
# answers one question — "do we own this gate?" — and a tool we do not own stays ON as a gap
# detector until we either adopt it or record why we will not.
#
# ⚠️ Tools for languages this repo does not contain are NOT listed. They never fire, so an
# `enabled: false` for them would be a decision nobody made, in a file nobody can then read.

language: en-US # (default: en-US) see the audience note under `profile`
tone_instructions: "" # (default: "") no persona; the review's job is findings, not voice
early_access: false # (default: false) opt out of unreleased behaviour on a repo that ships to PyPI
enable_free_tier: true # (default: true)
inheritance: false # (default: false) no parent config to inherit from — this file is the whole truth

# ⭐ THE HOUSE CONVENTIONS HAVE ONE HOME, AND IT IS NOT THIS FILE.
# CodeRabbit reads these documents and reviews against them, so the layered CLAUDE.md tree stays
# the single source of truth. Copying those rules in here instead would create a second copy that
# drifts the day a CLAUDE.md changes — the same failure class as a count restated in prose.
knowledge_base:
  opt_out: false # (default: false) retention is what makes `learnings` work at all
  web_search:
    enabled: true # (default: true) CVM/regulatory context is genuinely external
  code_guidelines:
    enabled: true # (default: true)
    filePatterns: # (default: []) — the whole point of this block
      - "**/CLAUDE.md" # root + bin/ + tests/ + docs/ + .github/, layered on purpose
      - "docs/contributing.md" # the contributor-facing rules (gate, auto-merge, branches)
  learnings:
    scope: auto # (default: auto) 'auto' = local for a public repo, which this is
    approval_delay: 0 # (default: 0) apply learnings immediately; a solo maintainer is the approver
  issues:
    scope: local # (default: auto) ← see the visibility trap below
  pull_requests:
    scope: local # (default: auto) ← same
  # ⚠️ `auto` IS NOT A CONSTANT — IT READS REPOSITORY VISIBILITY. For `scope` it means "local for
  # a public repo, global for a private one"; for the integrations below it means "disabled for
  # public repos". This repo is public today, so `auto` behaves as `local`/`disabled` — and the
  # day it flips to private, every one of these changes behaviour with NO commit and no diff.
  # Pinning the value we actually want removes that hidden dependency. Same reasoning as pinning
  # a default: the file must be the truth.
  automatic_repository_linking: false # (default: false)
  linked_repositories: [] # (default: []) — blueprintx is a candidate, but linking is its own call
  mcp:
    usage: disabled # (default: auto) no MCP server in this review path
    disabled_servers: [] # (default: null)
  jira:
    usage: disabled # (default: auto) tracker here is GitHub Issues
    project_keys: []
    excluded_project_keys: []
  linear:
    usage: disabled # (default: auto) same
    team_keys: []

chat:
  art: false # (default: true) ASCII art in every reply is noise in a thread that must carry verdicts
  auto_reply: true # (default: true)
  allow_non_org_members: true # (default: true) public repo — outside contributors may ask
  integrations:
    jira:
      usage: disabled # (default: auto — which means "disabled for public repos"; pinned, see above)
    linear:
      usage: disabled # (default: auto)

# What the finishing touches WRITE, when someone asks for them. These mirror the house rules
# rather than restating them, because generated code has to pass the same gates as hand-written
# code — bin/check_docstrings.py, the typing gate, ruff with tabs at 99 columns.
code_generation:
  docstrings:
    language: en-US # (default: en-US) code and docstrings are English here
    path_instructions:
      - path: "src/**/*.py"
        instructions: >-
          NumPy-style docstrings, indented with TABS, wrapped at 99 columns. Document every
          parameter with its type and every return value; document a raised exception ONLY if the
          function actually raises it — a documented-but-never-raised exception is what
          bin/check_docstrings.py reports. Explain WHY, not what: the code already shows what.
  unit_tests:
    path_instructions:
      - path: "tests/**/*.py"
        instructions: >-
          pytest functions with fixtures, never unittest.TestCase; name them
          test_<unit>_<scenario>_<expected_outcome> and assert ONE behaviour each. Never touch the
          network — mock the download boundary inside the reader's own module. ⚠️ A test that
          builds its input from the same contract it then asserts is a TAUTOLOGY and proves
          nothing: the non-tautological oracle is the verbatim published header pinned under
          tests/fixtures/. Prefer asserting a dtype or an identity over asserting emptiness, since
          an unrelated implementation usually satisfies "empty" too.

# Acts on ISSUES, not PRs. Issues here are authored through a strict template by the `/issue`
# skill (Objetivo / Escopo / Documentação), and they are the record of a decision — so generated
# content stays OUT of them, for exactly the reason the PR description stays human.
issue_enrichment:
  auto_enrich:
    enabled: false # (default: false)
  planning:
    enabled: true # (default: true) available on request
    auto_planning:
      enabled: false # (default: true) ← but never unasked
      labels: []
  labeling:
    labeling_instructions: []
    auto_apply_labels: false # (default: false) one label owner, and it is the gate

reviews:
  # The bot writes in English, like every other contributor-facing surface here (code, commit
  # messages, CI output). Only the PUBLISHED documentation follows the site's language
  # (mkdocs.yml theme.language, pt-BR). The boundary is the AUDIENCE, not the repository — so
  # `language` above is NOT single-sourced from theme.language, deliberately.
  # profile — the three values, so a future revisit needs no doc lookup (schema.v2.json):
  #   quiet      only the most important feedback
  #   chill      balanced feedback              ← THE DEFAULT
  #   assertive  more feedback, may feel nitpicky
  #
  # ⚠️ EVERY REVIEW BEFORE THIS FILE EXISTED RAN ON `chill`, by default — there was no
  # .coderabbit.yaml in the repo. So the baseline recorded in the #220 ledger (#210: 5 findings,
  # 4 valid · #217: 1, valid · #219: 3, all 3 valid) IS the chill baseline, and it is directly
  # comparable to what assertive produces from here on. That comparison is the pilot.
  #
  # `assertive` on purpose, and it is a cost decision, not a taste one: this repo's protocol
  # gives EVERY review thread a verified verdict (measured: 356–1126 chars per reply across 7
  # real ones), so each extra finding costs a written answer. It is worth it while the
  # path_instructions above are unproven — the pilot needs to see what they can catch, and a
  # quieter profile would hide that behind "nothing to report". Revisit once #220 has its
  # measurement; `chill` is the fallback, since it is what produced the baseline.
  profile: assertive

  # ⭐ DO NOT ABANDON A REVIEW WHEN THE PR MERGES. (default: true — which aborts it.)
  # Measured twice: a `docs`/`ci` PR is auto-merge-eligible and merges the moment the required
  # checks go green, which is FASTER than the review completes. #221 merged before the bot said
  # anything; #223 merged while its comment literally read "Currently processing new changes in
  # this PR" — and `required_review_thread_resolution` did not help, because that rule blocks an
  # unresolved thread that EXISTS, it does not wait for a reviewer to arrive.
  # This does not stop the merge. It stops the finding from being thrown away: the review lands
  # on the merged PR and becomes a follow-up issue instead of nothing at all.
  abort_on_close: false

  # ── The PR description belongs to the human ───────────────────────────────────────────────
  # This repo enforces a 5-section PR template with a blocking hook, so generated content must
  # not land in the description. `high_level_summary_in_walkthrough` moves the summary into the
  # walkthrough COMMENT, leaving the description exactly as authored.
  high_level_summary: true # (default: true)
  high_level_summary_in_walkthrough: true # (default: false) ← protects the PR template
  high_level_summary_placeholder: "@coderabbitai summary" # (default: same)
  high_level_summary_instructions: >-
    Write a concise bullet-point summary for a reviewer who knows this codebase. Lead with what
    changed and why, not with file names. Call out explicitly, when present: a change under
    `_internal/config/contracts/` (a one-character edit there is tiny AND catastrophic, and every
    test still passes because the tests assert the contract that was written); a new or changed
    column typed as a binary float when its fractional part carries meaning; a column added to
    `tuple_cnpj_cols` that can hold a CPF; a gate added to `.pre-commit-config.yaml` without the
    matching step in `.github/workflows/tests.yaml`, or the reverse; and any change to a
    published `docs/` page that restates a count derived from the code. If none of those apply,
    say so in one line rather than padding the summary.

  # Fires ONLY when the PR title contains the placeholder below — opt-in per PR, never automatic.
  auto_title_placeholder: "@coderabbitai" # (default: same)
  auto_title_instructions: >-
    The PR title becomes the SQUASH COMMIT SUBJECT when the quality gate auto-merges, so it must
    satisfy the same rules as a commit subject here: Conventional Commits
    (`<type>(<scope>): <subject>`) with type one of feat, fix, chore, docs, refactor, test; at
    most 72 characters; imperative mood; lowercase after the colon; no trailing period. Scope is
    the area touched (`ci`, `ingestion`, `submission`, `docs`). Describe the CHANGE, not the
    file. Write it in the same language as the repository's recent commit subjects.

  # ── Walkthrough content ───────────────────────────────────────────────────────────────────
  collapse_walkthrough: true # (default: true) keeps a long PR page navigable
  changed_files_summary: true # (default: true)
  sequence_diagrams: true # (default: true) cheap, and the reader/contract flows benefit
  estimate_code_review_effort: true # (default: true)
  assess_linked_issues: true # (default: true) every PR here closes an issue — this checks the fit
  related_issues: true # (default: true)
  related_prs: true # (default: true) datasets recur; the sibling PR is usually the anti-copy oracle
  poem: false # (default: false) pinned deliberately, per the "no generated voice" line above
  in_progress_fortune: false # (default: true) same reason
  enable_prompt_for_ai_agents: true # (default: true) the "Prompt for AI Agents" block is actionable
  review_status: true # (default: true) a SKIPPED review must be visible, never silent
  review_details: false # (default: false)
  review_progress: true # (default: true)
  commit_status: true # (default: true) legacy status; NOT wired as a required check — see #208
  fail_commit_status: false # (default: false) a review error must not red a PR whose code is fine

  # ⚠️ LABELS HAVE EXACTLY ONE OWNER, AND IT IS `bin/pr_gate.py`.
  # It writes `risk:*` / `size:*` / `gate:*` and replaces only its own. A second labeller either
  # fights it or suggests labels that do not exist in the repo — and a bot config declaring a
  # non-existent label errors on every PR it touches (measured previously with dependabot.yml).
  suggested_labels: false # (default: true)
  auto_apply_labels: false # (default: false)
  suggested_reviewers: false # (default: true) solo maintainer; the suggestion is always the same
  auto_assign_reviewers: false # (default: false)
  disable_cache: false # (default: false)

  # Reviewing a generated artifact is pure noise: its diff tracks a machine, not a decision. The
  # lockfile is the worked example — its size follows how many dependency hashes moved, which is
  # why the size veto exempts it too. Everything else stays reviewable ON PURPOSE, including
  # tests/fixtures/: a fixture changing IS the event worth noticing, because it is the one oracle
  # in the suite that we did not author.
  path_filters: # (default: [])
    - "!poetry.lock"
    - "!coverage.xml"
    - "!coverage.svg"

  # Public repo, so this one is live. It flags spam/low-quality PRs from outside.
  # ⚠️ `slop_detection.label` is the ONLY key in this file left unpinned, and that is a decision,
  # not an omission — recorded here because a missing key and a forgotten key look identical in a
  # diff. The schema types it as a string with no "explicitly none" value, and naming a label here
  # would break the one-owner rule (`bin/pr_gate.py` owns every label on a PR) and would error on
  # every PR if the label did not exist in the repo. Absent = no label applied, which is right.
  slop_detection:
    enabled: true # (default: true)

  labeling_instructions: [] # (default: []) unused — pr_gate.py owns labels
  suggested_reviewers_instructions: [] # (default: []) unused — solo maintainer
  mutually_exclusive_groups: {} # (default: {})
  post_merge_actions: [] # (default: [])

  # ⚠️ THESE ARE THE EMPHATIC SUBSET, NOT THE RULEBOOK. The rulebook is the CLAUDE.md tree, which
  # `knowledge_base.code_guidelines.filePatterns` above points at directly. What is restated here
  # is only what is path-scoped AND expensive to get wrong — a wrong contract, a laundered float,
  # a CPF declared as CNPJ. Deliberate redundancy where it pays; everything else stays in its one
  # home. When a rule below and a CLAUDE.md disagree, the CLAUDE.md wins and THIS FILE IS STALE.
  path_instructions:
    - path: "src/filings_cvm/_internal/config/contracts/**"
      instructions: >-
        A FileContract must be GENERATED from the artifact's published header bytes and PINNED to
        a fixture under tests/fixtures/<dataset>/, never transcribed and never copied from a
        sibling dataset. A wrong contract passes 100% of the tests, because the tests assert the
        contract that was written — the pinned header is the only non-tautological oracle. Flag
        any contract whose column tuple appears derived from another dataset: sibling members
        routinely share a width, a prefix, or even 18 of 19 headers and still differ in one
        column. `tuple_cnpj_cols` declares ONLY columns that hold nothing but CNPJ: a column that
        can hold a CPF (typically typed by a sibling PF/PJ column) stays out, even when the
        current year's data happens to be all CNPJ. An empty `tuple_cnpj_cols` can be a measured
        decision — do not flag it as an omission without checking the dataset notes.

    - path: "src/filings_cvm/ingestion/**"
      instructions: >-
        Every reader takes `path_raw: Path | None = None` and routes the raw-artifact handling
        through the shared `_internal/utils/raw_workspace.py` context manager — never re-branch on
        the tempdir inside a reader. Reads go through `_internal.utils.tabular_reader`, typing
        through `apply_dtypes` (never pandas inference), and Brazilian identifiers through
        `_internal.utils.br_identifiers`. A returned frame must be provenance-stamped via
        `stamp_provenance` AFTER contract validation. A new reader is registered along its own
        package chain up to its portal root and STOPS there — never in the top-level
        `filings_cvm/__init__.py` nor in `ingestion/__init__.py`; its contract also needs adding
        to `_internal/config/contracts/__init__.py`, which nothing fails to catch on its own.

    # The DOCS half of a reader/writer PR, which is the half that gets forgotten. Advisory on
    # purpose: whether a given change needs a doc edit is a JUDGEMENT (a private-helper rename
    # needs none), and a mechanical "touched src/ ⇒ must touch docs/" rule would be satisfied by
    # a whitespace edit while missing real drift — measured: 107 of 290 public readers are absent
    # from docs/api.md today, and every one of those PRs did touch docs/.
    - path: "src/filings_cvm/{ingestion,submission}/**"
      instructions: >-
        A new or renamed PUBLIC reader/writer is only half-delivered without its documentation.
        Check, and say which apply: an entry in `docs/api.md` (every public reader belongs there);
        the dataset's own page under `docs/ingestion/`; the catalog and Layout tree in the root
        `CLAUDE.md`; `docs/index.md`; and `mkdocs.yml` `nav:` when a page is added. Also check the
        registration chain — a new reader is exported along its own package `__init__` files up to
        its portal root and STOPS there (never the top-level `filings_cvm/__init__.py`), and its
        contract must be added to `_internal/config/contracts/__init__.py`, which nothing fails to
        catch on its own. Any count restated in prose must be RE-MEASURED from the code, never
        incremented. If the change is internal and needs no doc edit, say so explicitly rather
        than staying silent.

    - path: "src/**/*.py"
      instructions: >-
        A number whose fractional part carries meaning is NEVER a binary float: `float64` cannot
        represent most decimal fractions, the loss is silent and irreversible, and no contract or
        single-value test fails. Such a column is exact text or `list_decimal_cols`. One public
        class per module, named after the file; a private/shared base gets its own `_`-prefixed
        file. Runtime type checking is mandatory: every class declares a checker metaclass from
        `_internal.utils.typing` and every standalone function uses `@type_checker` — private
        helpers included; the only exemptions are Pydantic models, the typing engine itself, and
        dunders. NumPy docstrings, tabs, 99 columns, double quotes. Absolute imports only. Prefer
        a dict dispatch over an if/elif chain that merely selects a value, and guard clauses over
        nesting.

    - path: "tests/**/*.py"
      instructions: >-
        pytest functions with fixtures, never unittest.TestCase. No test touches the real network
        — mock the download boundary in the reader's own module, never the socket. Files under
        tests/fixtures/ are VERBATIM source bytes and must not be reformatted, re-encoded, or
        whitespace-normalised; they are the oracle. Watch for tautological assertions: a test that
        builds its input from the same constant it then asserts proves nothing. A test whose
        expectation is "absent"/"empty" is especially suspect, because an unrelated implementation
        usually satisfies it too — assert the dtype or the identity, not just emptiness.

    - path: "bin/**/*.sh"
      instructions: >-
        `set -euo pipefail`, logic in named functions driven by a `main "$@"` at the bottom, and
        all user-facing status through `print_status <level> <message>` from lib/common.sh — never
        a bare echo for status. Split `local x=$(cmd)` into a declaration plus an assignment
        (SC2155 — the `local` keyword swallows the exit code). Guard every `cd` (`|| return` in a
        sourced lib, `|| exit` in a standalone script). Any `# shellcheck disable=` other than the
        globally excluded SC1091 must be line-scoped and carry a reason.

    - path: ".github/workflows/**"
      instructions: >-
        Every lint/static/test gate must exist in BOTH .pre-commit-config.yaml AND this workflow,
        changed in the same commit — CI runs its gates as explicit steps and does not invoke
        `pre-commit run`, so adding a hook does not cover CI. An `on:` event must be a real
        WORKFLOW TRIGGER, not merely a real webhook event: an invalid one makes GitHub reject the
        whole file, so the workflow does not run at all and the symptom looks like a slow gate
        rather than a dead one. A downloaded binary that will be EXECUTED must be pinned by
        version and verified by checksum before extraction, and a failed install must fail the
        job rather than fall through to a wrapper's graceful skip — a gate that reports its own
        blindness as OK is worse than no gate.

    - path: "docs/**"
      instructions: >-
        Everything under docs/ is published by MkDocs except folders listed in `exclude_docs`
        (docs/backlog/), so a working note dropped at the docs/ root ships to readers. New
        published pages are registered in mkdocs.yml `nav:` in the same commit. Any count or
        roster restated in prose is derived knowledge that rots silently — when correcting one,
        RE-MEASURE from the code, never increment.

  auto_review:
    enabled: true # (default: true)
    auto_incremental_review: true # (default: true) re-review on each push — the fix must be seen
    auto_pause_after_reviewed_commits: 0 # (default: 5) NEVER pause: a long PR is exactly where a
    # late commit is least reviewed, and a silent pause
    # is a gate that stops without saying so
    drafts: false # (default: false) a draft is not asking yet
    description_keyword: "" # (default: "") irrelevant while `enabled` is true
    ignore_title_keywords: [] # (default: []) no escape hatch by title — "wip"/"skip" in a title
    # must not silently buy a pass past the reviewer
    labels: [] # (default: []) review every PR, not a label-selected subset
    base_branches: [] # (default: []) only `main` exists as a base here
    ignore_usernames: [] # (default: []) do NOT skip bots — measured in #208 that CodeRabbit
    # already declines to review bot PRs on its own; listing them
    # here would hide that behaviour behind our own config

  # All of these are TRIGGERED by a checkbox or an `@coderabbitai` command — none runs on its own,
  # so leaving them on costs nothing and keeps the tool available when it is actually wanted.
  # ⚠️ Whatever they generate is still a proposal: it must pass this repo's own gates (NumPy
  # docstrings via bin/check_docstrings.py, the typing gate, the fixture-as-oracle rule) before it
  # can land. A generated test that asserts the contract we wrote is a tautology, not coverage.
  finishing_touches:
    docstrings:
      enabled: true # (default: true)
    unit_tests:
      enabled: true # (default: true)
    simplify:
      enabled: true # (default: false) opt-in review for reuse/efficiency, on request
    autofix:
      enabled: true # (default: true)
    fix_ci:
      enabled: true # (default: true)
    resolve_merge_conflict:
      enabled: true # (default: true)
    custom: [] # (default: [])

  tools:
    # ── We own these gates. Disabled here so one rule has one home. ──────────────────────
    # ruff.toml + pre-commit + CI
    ruff:
      enabled: false
    # superseded by ruff
    flake8:
      enabled: false
    pylint:
      enabled: false
    # bin/lint_shell.sh
    shellcheck:
      enabled: false
    # bin/lint_yaml.sh + .yamllint
    yamllint:
      enabled: false
    # bin/lint_sql.sh + .sqlfluff
    sqlfluff:
      enabled: false
    # hadolint-docker hook
    hadolint:
      enabled: false
    # ⭐ actionlint is the proof of this file's whole thesis: it lived ONLY here until #217
    # showed a workflow GitHub rejected outright while every local hook was green. We adopted
    # the gate (#218, bin/lint_actions.sh) — and only THEN did turning it off become honest.
    actionlint:
      enabled: false
    # GitGuardian (a required check) + detect-private-key / detect-aws-credentials
    gitleaks:
      enabled: false
    trufflehog:
      enabled: false

    # ── ⚠️ WE DO NOT OWN THESE. Left ON as gap detectors — see #220. ─────────────────────
    # Each one is a standing question, not an oversight. Turning any of them off is only
    # honest AFTER we adopt the gate or write down why we will not. What they report during
    # this pilot is the measurement that decides.
    #
    # Actions SECURITY — NOT the same question as actionlint's schema check. This is the
    # workflow-injection class (untrusted `github.event.*` interpolated into `run:`), and we
    # have no gate for it at all.
    zizmor:
      enabled: true
    # No markdown lint here; codespell covers spelling only.
    markdownlint:
      enabled: true
    # The Makefile is a CI surface and is entirely ungated.
    checkmake:
      enabled: true
    # Dependency CVEs — the still-open question in #90 (pip-audit vs Snyk).
    osvScanner:
      enabled: true
    # PII: this repo handles CPF under LGPD and keeps its PII fixtures header-only ON PURPOSE,
    # so this one is as likely to produce false positives as findings. Measuring which is the
    # point of the pilot.
    presidio:
      enabled: true

  # ⚠️ THIS BLOCK LIVES UNDER `reviews`, NOT AT THE TOP LEVEL. It shipped at the top level in
  # #221 and CodeRabbit **ignored it whole** (`Unrecognized key: "pre_merge_checks"`), reporting
  # it in a NOTE inside the review comment — on a PR that auto-merged, so nobody would have read
  # it. Measured against the published schema
  # (storage.googleapis.com/coderabbit_public_assets/schema.v2.json): the valid top level is
  # chat / code_generation / early_access / enable_free_tier / inheritance / issue_enrichment /
  # knowledge_base / language / reviews / tone_instructions.
  #
  # The docs page lists `pre_merge_checks` as its own section, which is what misled me — and
  # that is the #217 lesson in a new suit: **a documentation reference confirms a name EXISTS;
  # it does not tell you WHERE it is accepted.** For a config file, validate against the
  # published schema, never against the prose. (#222)
  pre_merge_checks:
    override_requested_reviewers_only: false # (default: false) solo maintainer; nobody else could
    # override, so this would lock the checks

    # ⚠️ `docstrings` is OFF, not merely absent: bin/check_docstrings.py owns docstring coverage,
    # in pre-commit AND in CI. Two sources of truth for one rule drift and double-report.
    docstrings:
      mode: "off" # (default: warning)
      threshold: 80 # (default: 80) inert while mode is off; pinned so a mode change is deliberate

    # ⭐ THE PR TITLE IS THE SQUASH COMMIT SUBJECT when the gate auto-merges — and NOTHING
    # validates it today: commitizen and gitlint run on the COMMIT MESSAGE at commit time, never
    # on the PR title. So this is the only check on a string that lands in `main`'s history.
    #
    # ⚠️ UPGRADE PATH, deliberately not taken here: per the schema, `mode: error` only BLOCKS when
    # `request_changes_workflow: true` — that flag is what gives these checks teeth, and without
    # it `error` merely posts louder. Turning both on would close the gap for real, at the cost of
    # a bot able to block a merge. Left as a conscious decision for after the #220 measurement.
    title:
      mode: warning # (default: warning) → `error` + request_changes_workflow to make it binding
      requirements: >-
        Conventional Commits `<type>(<scope>): <subject>`, type one of feat, fix, chore, docs,
        refactor, test. At most 72 characters. Imperative mood, lowercase after the colon, no
        trailing period. The subject must describe the change, not the files touched.
    description:
      mode: warning # (default: warning) the 5-section template is already hook-enforced at creation
    issue_assessment:
      mode: warning # (default: warning) every PR here closes an issue; a mismatch is worth saying
    custom_checks: [] # (default: [])

  # ⚠️ FALSE, and it is the interesting one. Two halves, and only one is inert here:
  #   • the "auto-approve once comments are resolved" half IS inert — the ruleset requires ZERO
  #     approvals (a solo maintainer cannot approve their own PR), so a bot approval unblocks
  #     nothing. Same reasoning as `pr_gate.py`'s "why auto-MERGE and not auto-APPROVE".
  #   • the other half is NOT inert: this flag is what lets `pre_merge_checks.*.mode: error`
  #     actually block a merge (see the title check above).
  # It does NOT fix the measured race, though: #221 and #223 merged before any review existed, and
  # a review that never happened cannot request changes. Flip it only together with an `error`
  # mode, and only after deciding a bot may hold a merge.
  request_changes_workflow: false # (default: false)
