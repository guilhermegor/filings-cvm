[mypy]
explicit_package_bases = True
namespace_packages = True

ignore_missing_imports = False

check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

exclude = (?x)(^utils/typing/|_internal/utils/typing/)

[mypy-utils.typing.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-chassis.typing.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-*._internal.utils.typing.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-wwdates.*]
ignore_missing_imports = True

[mypy-defusedxml.*]
ignore_missing_imports = True

[mypy-win32com.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pyodbc.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True
