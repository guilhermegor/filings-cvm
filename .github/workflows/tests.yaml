name: Run Tests

on:
  # `workflow_call` is used by both release workflows, which gate on this workflow's job
  # outcome via `needs:` — a failed called workflow fails the caller. It declares NO
  # outputs: it used to expose `ready_for_release: ${{ jobs.test.result == 'success' }}`,
  # which was dead AND wrong. Dead because nothing ever read it; wrong because inside
  # `on.workflow_call.outputs.value` the `jobs.<id>` context exposes only `outputs`, never
  # `result` — so the expression referenced a property that does not exist, and an output
  # advertising "did the tests pass" could never say yes. Surfaced by actionlint (#218).
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  test:
    name: Run Automated Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history so the work-ledger gate can resolve merge-base(HEAD, origin/main); a
          # shallow clone has no common ancestor to diff the branch against.
          fetch-depth: 0

      - name: Set Up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.2.1

      # Unconditional and BEFORE the cache restore / any pyproject rewrite: it must run on a warm
      # cache too, and check the same tree a developer checks locally. Fail loud on a stale lock
      # instead of silently regenerating it — regenerating (rm + poetry lock) would re-resolve and
      # upgrade every dependency to the latest in-range version, a non-reproducible build that can
      # pull a breaking release. (A version bump does NOT invalidate the lock — only a dependency
      # change does — so `make bump_version` never trips this.)
      - name: Check Lock File Is In Sync
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is out of sync with pyproject.toml — run 'poetry lock' locally and commit the result." >&2
            exit 1
          fi

      # Key on poetry.lock too: a lock-only change (what Dependabot's lockfile-only bumps produce)
      # must miss the cache, else the install is skipped and a stale .venv is tested green (#195).
      # Cache build output only — never a tracked file, or the restore overwrites the committed lock.
      - name: Load Cached Virtual Environment
        id: cached-venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install Dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: |
          cp pyproject.toml pyproject.original.toml
          cat pyproject.original.toml | python -c '
          import sys, re, os as _os
          content = sys.stdin.read()
          if _os.name != "nt":
              content = re.sub(r".*platform\s*=\s*\"win32\".*", "", content)
              content = re.sub(r"pywin32\s*=.*\n", "", content)
          print(content)
          ' > pyproject.toml

          echo "No groups to exclude, installing all dependencies"
          poetry install --no-interaction --no-root

          # Restore original pyproject.toml
          mv pyproject.original.toml pyproject.toml
          poetry env activate

      - name: Run Spell Check (codespell)
        if: runner.os == 'Linux'
        run: |
          poetry run codespell .
          if [ $? -ne 0 ]; then
            echo "Typos found! Run 'codespell .' locally to see them."
            exit 1
          fi

      - name: Run Docstring Type Consistency Check
        if: runner.os == 'Linux'
        run: |
          poetry run python -m pydocstyle --select=D412,D417 --match="(src|tests).*\\.py" src/ tests/
          poetry run python bin/check_docstrings.py

      - name: Run Runtime Type-Checking Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-typing` pre-commit hook: every src/ class/function carries the
        # runtime checker (TypeChecker metaclass / @type_checker), Pydantic models excepted.
        # CI runs its gates as explicit steps, not via pre-commit, so this must be listed
        # here or a hook-skipping contributor bypasses the check entirely.
        run: poetry run python bin/check_typing.py

      - name: Run Provenance-Stamp Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-provenance` pre-commit hook: every src/ module that calls
        # read_table must also call stamp_provenance, so no ingested frame ships without its
        # url/updated_at/source_key/... columns. Explicit CI step (gate parity with pre-commit).
        run: poetry run python bin/check_provenance.py

      - name: Run Schema-Model Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-schemas` pre-commit hook: every class in a
        # _internal/config/schemas/ module must derive from pydantic BaseModel (or be a
        # domain Enum). Explicit CI step (gate parity with pre-commit).
        run: poetry run python bin/check_schemas.py

      - name: Run Docs-Structure Gate
        if: runner.os == 'Linux'
        # Mirrors the `check-docs-sections` pre-commit hook: canonical pages exist and are in
        # the nav, every published page is in the nav, and each docs family carries its
        # required sections (legacy offenders allowlisted). Explicit step (gate parity).
        run: poetry run python bin/check_docs_sections.py

      - name: Run Binary-Float Dtype Ban
        if: runner.os == 'Linux'
        # Mirrors the `check-dtypes` pre-commit hook: no src/ module may declare a binary float
        # dtype for an ingested column, because that destroys the source's exact value
        # irreversibly and silently. Use list_decimal_cols (exact Decimal) or text instead; a
        # genuinely dimensionless value opts out with `# dtype-ok: <reason>`. Explicit CI step
        # (gate parity with pre-commit) — a hook-only gate is bypassed by `--no-verify`.
        run: poetry run python bin/check_dtypes.py

      - name: Run README Structure Gate
        if: runner.os == 'Linux'
        # Mirrors the `readme-structure` pre-commit hook: plain headings, slug markers on the
        # required sections, Authors with GitHub + LinkedIn links. Explicit CI step (gate
        # parity with pre-commit) so a `--no-verify` commit cannot bypass it.
        run: bash bin/check_readme_structure.sh README.md

      - name: Run Work-Ledger Enforcement
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        # Mirrors the `check-backlog-ledger` pre-commit hook: a branch touching any src/ci path
        # must add or edit a docs/backlog work ledger. Diff-based, so the PR base SHA is the
        # comparison point — passed via env (never inline in run:) and reachable from the
        # fetch-depth:0 merge checkout. Explicit CI step (gate parity with pre-commit).
        env:
          LEDGER_BASE_REF: ${{ github.event.pull_request.base.sha }}
          # The PR's AUTHOR, which never changes — unlike GITHUB_ACTOR, which becomes whoever
          # re-ran or updated the branch and so would silently cancel the bot exemption.
          LEDGER_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: poetry run python bin/check_backlog_ledger.py

      - name: Run Ruff Linting
        if: runner.os == 'Linux'
        run: |
          poetry run ruff check src/ tests/ --config=ruff.toml
          if [ $? -ne 0 ]; then
            echo "Ruff found issues! Run 'ruff check src/ tests/' locally see details."
            echo "To fix automatically, run: poetry run ruff check --fix src/ tests/"
            exit 1
          fi

      - name: Run Ruff Format Check
        if: runner.os == 'Linux'
        # Mirrors the `ruff-format` pre-commit hook — CI must fail on unformatted code,
        # not just flag lint issues. Fix locally with `poetry run ruff format src/ tests/`.
        run: poetry run ruff format --check src/ tests/ --config=ruff.toml

      - name: Run Static Type Check (mypy)
        if: runner.os == 'Linux'
        # Run from src/ so it is the single package base (avoids the dual-root
        # "found twice" error on the deeper DDD tree).
        run: cd src && poetry run mypy --config-file ../mypy.ini .

      - name: Run Non-Python Lint Gates (shell, sql, yaml, actions)
        if: runner.os == 'Linux'
        # Mirrors `make lint` and the pre-commit lint-* hooks (one home, zero drift).
        # shellcheck/shfmt/actionlint are system tools; install them so
        # the gates actually RUN in CI — the wrappers skip gracefully on a box without
        # them, which is right locally and would be a placebo here.
        #
        # actionlint is pinned and fetched from its release page, not piped from a remote
        # install script, and NOT taken as a poetry dev-dep: `actionlint-py` is sdist-only
        # and downloads the binary at build time, which would put a network fetch inside
        # every `poetry install` on all three matrices.
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Pinning the VERSION only pins what to ask for; it does not pin what arrives. The
          # digest is what makes the download reproducible and makes a swapped/corrupted
          # asset fail loudly instead of being unpacked and RUN. Recompute on every bump:
          #   sha256sum actionlint_<v>_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          poetry run pip install shfmt-py >/dev/null 2>&1 || true
          curl -sSLf -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --status \
            || { echo "actionlint checksum mismatch — refusing to extract"; exit 1; }
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          # A failed install must FAIL here, never fall through to the wrapper's graceful
          # skip — a gate that reports its own blindness as OK is worse than no gate.
          command -v actionlint >/dev/null || { echo "actionlint missing after install"; exit 1; }
          bash bin/lint_shell.sh --check
          bash bin/lint_sql.sh
          bash bin/lint_yaml.sh
          bash bin/lint_actions.sh

      # ---- BEGIN code- and test-quality guards (#294) ----------------------------------
      # Mirrors the "code- and test-quality guards (#294)" block of .pre-commit-config.yaml
      # (gate parity). The five flagging guards run through bin/quality_ratchet.py against
      # bin/quality_baseline.txt; see that script for why a ratchet and not a weaker limit.
      - name: Run Function Length Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/quality_ratchet.py function-length python bin/check_function_length.py

      - name: Run Complexity Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/quality_ratchet.py complexity bash bin/check_complexity.sh

      - name: Run Dead-Code Gate
        if: runner.os == 'Linux'
        # vulture is not a Poetry dependency (the guard self-skips without it, which is right
        # on a laptop and a placebo here), so CI installs a pinned copy before running it.
        env:
          VULTURE_VERSION: 2.16
        run: |
          poetry run pip install "vulture==${VULTURE_VERSION}" >/dev/null
          poetry run python bin/quality_ratchet.py dead-code python bin/check_dead_code.py

      - name: Run __all__ Export Completeness Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/quality_ratchet.py all-exports python bin/check_all_exports.py

      - name: Run One-Assert Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/quality_ratchet.py one-assert python bin/check_one_assert.py

      - name: Run Fixture Scope Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_fixture_scope.py

      - name: Run Assertion Weakening Gate
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: poetry run python bin/check_assertion_weakening.py

      - name: Run Coverage Floor Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_coverage_floor.py

      - name: Run Gate Integrity Gate
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: poetry run python bin/check_gate_integrity.py

      - name: Run Required Checks Sync Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_required_checks_sync.py --required-list bin/required-checks.txt
      - name: Run Documentation-Language Boundary Enforcement
        if: runner.os == 'Linux'
        run: poetry run python bin/check_comment_language.py

      - name: Run Comment Budget Ratchet
        if: runner.os == 'Linux'
        run: poetry run python bin/check_comment_budget.py --require-baseline
      # ---- END code- and test-quality guards (#294) ------------------------------------

      - name: Run Integration Tests
        # `|| [ $? -eq 5 ]` tolerates pytest exit 5 ("no tests collected") so a
        # fresh project with an empty integration suite does not fail CI; real
        # failures (exit 1) still fail the step.
        run: poetry run pytest tests/integration/ -v || [ $? -eq 5 ]

      - name: Run Unit Tests
        run: poetry run pytest tests/unit/ || [ $? -eq 5 ]

      - name: Run Coverage Gate
        if: runner.os == 'Linux'
        # Enforce the coverage floor (`.coveragerc` [report] fail_under) on every PR,
        # mirroring the pre-commit `coverage-check` hook. The badge step below runs only on
        # main/tags, so without this a PR could drop coverage below the floor uncaught.
        run: poetry run pytest tests/unit/ --cov=src --cov-report=term-missing || [ $? -eq 5 ]

      - name: Run Coverage Report
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          poetry run pytest --cov=src --cov-report=xml --no-header -q tests/unit/
          poetry run genbadge coverage --local -i coverage.xml -o coverage.svg

      - name: Upload Badge
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.svg
