name: Run Tests

on:
  # `workflow_call` is used by both release workflows, which gate on this workflow's job
  # outcome via `needs:` — a failed called workflow fails the caller. It declares NO
  # outputs: it used to expose `ready_for_release: ${{ jobs.test.result == 'success' }}`,
  # which was dead AND wrong. Dead because nothing ever read it; wrong because inside
  # `on.workflow_call.outputs.value` the `jobs.<id>` context exposes only `outputs`, never
  # `result` — so the expression referenced a property that does not exist, and an output
  # advertising "did the tests pass" could never say yes. Surfaced by actionlint (#218).
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  test:
    name: Run Automated Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history so the work-ledger gate can resolve merge-base(HEAD, origin/main); a
          # shallow clone has no common ancestor to diff the branch against.
          fetch-depth: 0

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.2.1

      - name: Load Cached Virtual Environment
        id: cached-venv
        uses: actions/cache@v6
        with:
          path: |
            .venv
            poetry.lock
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: |
          cp pyproject.toml pyproject.original.toml
          cat pyproject.original.toml | python -c '
          import sys, re, os as _os
          content = sys.stdin.read()
          if _os.name != "nt":
              content = re.sub(r".*platform\s*=\s*\"win32\".*", "", content)
              content = re.sub(r"pywin32\s*=.*\n", "", content)
          print(content)
          ' > pyproject.toml

          # Fail loud on a stale lock instead of silently regenerating it. A poetry.lock
          # that no longer matches pyproject.toml means dependencies changed without
          # re-locking; regenerating here (rm + poetry lock) would re-resolve and upgrade
          # every dependency to the latest in-range version — a non-reproducible build that
          # can silently pull a breaking release. Require an intentional `poetry lock` +
          # commit instead. (A version bump does NOT invalidate the lock — only a dependency
          # change does — so `make bump_version` never trips this.)
          if ! poetry check --lock; then
            echo "::error::poetry.lock is out of sync with pyproject.toml — run 'poetry lock' locally and commit the result." >&2
            exit 1
          fi

          echo "No groups to exclude, installing all dependencies"
          poetry install --no-interaction --no-root

          # Restore original pyproject.toml
          mv pyproject.original.toml pyproject.toml
          poetry env activate

      - name: Run Spell Check (codespell)
        if: runner.os == 'Linux'
        run: |
          poetry run codespell .
          if [ $? -ne 0 ]; then
            echo "Typos found! Run 'codespell .' locally to see them."
            exit 1
          fi

      - name: Run Docstring Type Consistency Check
        if: runner.os == 'Linux'
        run: |
          poetry run python -m pydocstyle --select=D412,D417 --match="(src|tests).*\\.py" src/ tests/
          poetry run python bin/check_docstrings.py

      - name: Run Runtime Type-Checking Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-typing` pre-commit hook: every src/ class/function carries the
        # runtime checker (TypeChecker metaclass / @type_checker), Pydantic models excepted.
        # CI runs its gates as explicit steps, not via pre-commit, so this must be listed
        # here or a hook-skipping contributor bypasses the check entirely.
        run: poetry run python bin/check_typing.py

      - name: Run Provenance-Stamp Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-provenance` pre-commit hook: every src/ module that calls
        # read_table must also call stamp_provenance, so no ingested frame ships without its
        # url/updated_at/source_key/... columns. Explicit CI step (gate parity with pre-commit).
        run: poetry run python bin/check_provenance.py

      - name: Run Binary-Float Dtype Ban
        if: runner.os == 'Linux'
        # Mirrors the `check-dtypes` pre-commit hook: no src/ module may declare a binary float
        # dtype for an ingested column, because that destroys the source's exact value
        # irreversibly and silently. Use list_decimal_cols (exact Decimal) or text instead; a
        # genuinely dimensionless value opts out with `# dtype-ok: <reason>`. Explicit CI step
        # (gate parity with pre-commit) — a hook-only gate is bypassed by `--no-verify`.
        run: poetry run python bin/check_dtypes.py

      - name: Run Work-Ledger Enforcement
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        # Mirrors the `check-backlog-ledger` pre-commit hook: a branch touching any src/ci path
        # must add or edit a docs/backlog work ledger. Diff-based, so the PR base SHA is the
        # comparison point — passed via env (never inline in run:) and reachable from the
        # fetch-depth:0 merge checkout. Explicit CI step (gate parity with pre-commit).
        env:
          LEDGER_BASE_REF: ${{ github.event.pull_request.base.sha }}
          # The PR's AUTHOR, which never changes — unlike GITHUB_ACTOR, which becomes whoever
          # re-ran or updated the branch and so would silently cancel the bot exemption.
          LEDGER_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: poetry run python bin/check_backlog_ledger.py

      - name: Run Ruff Linting
        if: runner.os == 'Linux'
        run: |
          poetry run ruff check src/ tests/ --config=ruff.toml
          if [ $? -ne 0 ]; then
            echo "Ruff found issues! Run 'ruff check src/ tests/' locally see details."
            echo "To fix automatically, run: poetry run ruff check --fix src/ tests/"
            exit 1
          fi

      - name: Run Ruff Format Check
        if: runner.os == 'Linux'
        # Mirrors the `ruff-format` pre-commit hook — CI must fail on unformatted code,
        # not just flag lint issues. Fix locally with `poetry run ruff format src/ tests/`.
        run: poetry run ruff format --check src/ tests/ --config=ruff.toml

      - name: Run Static Type Check (mypy)
        if: runner.os == 'Linux'
        # Run from src/ so it is the single package base (avoids the dual-root
        # "found twice" error on the deeper DDD tree).
        run: cd src && poetry run mypy --config-file ../mypy.ini .

      - name: Run Non-Python Lint Gates (shell, sql, yaml, actions)
        if: runner.os == 'Linux'
        # Mirrors `make lint` and the pre-commit lint-* hooks (one home, zero drift).
        # shellcheck/shfmt/actionlint are system tools; install them so
        # the gates actually RUN in CI — the wrappers skip gracefully on a box without
        # them, which is right locally and would be a placebo here.
        #
        # actionlint is pinned and fetched from its release page, not piped from a remote
        # install script, and NOT taken as a poetry dev-dep: `actionlint-py` is sdist-only
        # and downloads the binary at build time, which would put a network fetch inside
        # every `poetry install` on all three matrices.
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          poetry run pip install shfmt-py >/dev/null 2>&1 || true
          curl -sSLf -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          # A failed install must FAIL here, never fall through to the wrapper's graceful
          # skip — a gate that reports its own blindness as OK is worse than no gate.
          command -v actionlint >/dev/null || { echo "actionlint missing after install"; exit 1; }
          bash bin/lint_shell.sh --check
          bash bin/lint_sql.sh
          bash bin/lint_yaml.sh
          bash bin/lint_actions.sh

      - name: Run Integration Tests
        # `|| [ $? -eq 5 ]` tolerates pytest exit 5 ("no tests collected") so a
        # fresh project with an empty integration suite does not fail CI; real
        # failures (exit 1) still fail the step.
        run: poetry run pytest tests/integration/ -v || [ $? -eq 5 ]

      - name: Run Unit Tests
        run: poetry run pytest tests/unit/ || [ $? -eq 5 ]

      - name: Run Coverage Gate
        if: runner.os == 'Linux'
        # Enforce the coverage floor (`.coveragerc` [report] fail_under) on every PR,
        # mirroring the pre-commit `coverage-check` hook. The badge step below runs only on
        # main/tags, so without this a PR could drop coverage below the floor uncaught.
        run: poetry run pytest tests/unit/ --cov=src --cov-report=term-missing || [ $? -eq 5 ]

      - name: Run Coverage Report
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          poetry run pytest --cov=src --cov-report=xml --no-header -q tests/unit/
          poetry run genbadge coverage -i coverage.xml -o coverage.svg

      - name: Upload Badge
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.svg
