name: Secret Scan

# Second, independent secret scanner (GitGuardian). The always-on scanner is gitleaks, run by
# tests.yaml through bin/check_secrets.sh with no key. This workflow adds ggshield on top and
# needs the GITGUARDIAN_API_KEY repository secret; without it the job reports that it did NOT
# scan (a warning annotation) instead of failing every PR on a missing credential.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  secret-scan:
    name: GitGuardian - secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_KEY: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
      IS_BOT_PR: ${{ github.event_name == 'pull_request' && endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Report that ggshield did not run
        if: env.HAS_KEY != 'true' || env.IS_BOT_PR == 'true'
        run: |
          echo "::warning::GitGuardian secret scan did NOT run (no GITGUARDIAN_API_KEY visible to this run)."
          echo "This is NOT 'scanned, found nothing': gitleaks (tests.yaml) scans the same range"
          echo "unconditionally. A Dependabot-triggered run only sees the Dependabot secret store:"
          echo "  gh secret set GITGUARDIAN_API_KEY --app dependabot --repo <owner>/<repo>"

      - name: Install ggshield
        if: env.HAS_KEY == 'true' && env.IS_BOT_PR != 'true'
        run: pipx install ggshield

      - name: Scan the push/PR range for secrets
        if: >-
          env.HAS_KEY == 'true' && env.IS_BOT_PR != 'true' &&
          (github.event_name == 'pull_request' ||
           (github.event_name == 'push' &&
            github.event.before != '0000000000000000000000000000000000000000'))
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.before }}
        run: ggshield secret scan ci

      - name: Scan the whole repository for secrets
        if: >-
          env.HAS_KEY == 'true' && env.IS_BOT_PR != 'true' &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'push' ||
           github.event.before == '0000000000000000000000000000000000000000')
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: ggshield secret scan repo .
