name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3, 1.2.3a1, 1.2.3b1, 1.2.3rc1)'
        required: true
        type: string
      backfill:
        description: 'Rebuild every vX.Y.Z tag under PACKAGE_NAME and upload the missing ones (version is ignored)'
        required: false
        type: boolean
        default: false

env:
  PACKAGE_NAME: "opendata-cvm"
  OWNER: "guilhermegor"

permissions:
  contents: read

jobs:
  # Hard release gate: always run the full test suite (tests.yaml, full matrix) on the code
  # being released. The build/publish jobs depend on this, so a release cannot proceed unless
  # the tests actually pass here — the gate is enforced by the pipeline, never self-attested
  # via a form input.
  run_tests:
    if: ${{ !inputs.backfill }}
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  details:
    if: ${{ !inputs.backfill }}
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      suffix: ${{ steps.release.outputs.suffix }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check Ref Type
        if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        run: echo "This is not a tag or workflow_dispatch; exiting"; exit 1

      - name: Extract Tag and Details
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            NEW_VERSION="$INPUT_VERSION"
            SUFFIX=$(echo "$NEW_VERSION" | grep -oP '[a-z]+[0-9]+' || echo "")
            TAG_NAME="v$NEW_VERSION"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            NEW_VERSION=$(echo $TAG_NAME | awk -F'-' '{print $1}')
            SUFFIX=$(echo $TAG_NAME | grep -oP '[a-z]+[0-9]+' || echo "")
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Debug Outputs
        if: ${{ env.RUNNER_DEBUG == '1' }}
        run: |
          echo "Version is ${{ steps.release.outputs.new_version }}"
          echo "Suffix is ${{ steps.release.outputs.suffix }}"
          echo "Tag name is ${{ steps.release.outputs.tag_name }}"

  check_pypi:
    needs: details
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Information from PyPI
        run: |
          code=$(curl -sS -o pypi.json -w '%{http_code}' https://pypi.org/pypi/${{ env.PACKAGE_NAME }}/json)
          if [ "$code" = "404" ]; then echo '{"releases":{}}' > pypi.json
          elif [ "$code" != "200" ]; then echo "PyPI answered HTTP $code"; exit 1; fi
          jq -e '.releases | type == "object"' pypi.json > /dev/null || { echo "malformed PyPI payload"; exit 1; }
          cat > "$RUNNER_TEMP/pep440_max.sh" <<'EOS'
          pep440_max() { sed -E 'h; s/\.?dev([0-9]+)/~~dev\1/; s/([0-9])(a|b|rc)([0-9]+)/\1~\2\3/; s/(\.0)+(\$|~)/\2/; G; s/\n/\t/' | sort -t "$(printf '\t')" -k1,1V | tail -n 1 | cut -f2; }
          EOS
          . "$RUNNER_TEMP/pep440_max.sh"
          latest_previous_version=$(jq -r '.releases // {} | keys[]' pypi.json | pep440_max)
          if [ -z "$latest_previous_version" ]; then
            echo "Package not found on PyPI."
            latest_previous_version="0.0.0"
          fi
          echo "Latest version on PyPI: $latest_previous_version"
          echo "latest_previous_version=$latest_previous_version" >> $GITHUB_ENV

          NEW_VERSION=${{ needs.details.outputs.new_version }}
          LATEST_VERSION=$latest_previous_version
          if [ "$(printf '%s\n' "$LATEST_VERSION" "$NEW_VERSION" | pep440_max)" != "$NEW_VERSION" ] || [ "$NEW_VERSION" == "$LATEST_VERSION" ]; then
            echo "The new version $NEW_VERSION is not greater than the latest version $LATEST_VERSION on PyPI."
            exit 1
          else
            echo "The new version $NEW_VERSION is greater than the latest version $LATEST_VERSION on PyPI."
          fi

  release_gate:
    name: 1.0.0 release gate
    needs: [details, check_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail a 0.x to 1.0.0 release while open issues lack post-1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ needs.details.outputs.new_version }}
        run: |
          code=$(curl -sS -o pypi.json -w '%{http_code}' https://pypi.org/pypi/${{ env.PACKAGE_NAME }}/json)
          if [ "$code" = "404" ]; then echo '{"releases":{}}' > pypi.json
          elif [ "$code" != "200" ]; then echo "PyPI answered HTTP $code"; exit 1; fi
          jq -e '.releases | type == "object"' pypi.json > /dev/null || { echo "malformed PyPI payload"; exit 1; }
          python3 bin/check_release_gate.py --new-version "$NEW_VERSION" --pypi-json pypi.json

  setup_and_build:
    needs: [details, check_pypi, release_gate, run_tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set Up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.1.2

      - name: Load Cached Virtual Environment
        id: cached-venv
        uses: actions/cache@v6
        with:
          path: |
            .venv
            poetry.lock
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: |
          # temporary pyproject without Windows platform-specific dependencies
          cp pyproject.toml pyproject.original.toml
          cat pyproject.original.toml | python -c '
          import sys, re
          content = sys.stdin.read()
          content = re.sub(r".*platform\s*=\s*\"win32\".*", "", content)
          content = re.sub(r"pywin32\s*=.*\n", "", content)
          print(content)
          ' > pyproject.toml

          # regenerate lock file, if needed
          if ! poetry check --lock; then
            echo "Lock file is outdated, regenerating..."
            rm -f poetry.lock
            poetry lock --no-cache
          fi

          # install dependencies, excluding dev and docs groups if present
          without_groups=()
          if grep -q '\[tool.poetry.group.dev\]' pyproject.toml; then
            without_groups+=("dev")
          fi
          if grep -q '\[tool.poetry.group.docs\]' pyproject.toml; then
            without_groups+=("docs")
          fi
          if [ ${#without_groups[@]} -gt 0 ]; then
            echo "Excluding groups: ${without_groups[*]}"
            poetry install --no-interaction --no-root --without "$(IFS=,; echo "${without_groups[*]}")"
          else
            echo "No groups to exclude, installing all dependencies"
            poetry install --no-interaction --no-root
          fi

          # restore original pyproject.toml
          mv pyproject.original.toml pyproject.toml
          poetry env activate

      - name: Build Package
        env:
          # Stamp the requested version directly via POETRY_DYNAMIC_VERSIONING_BYPASS instead of
          # creating a local git tag. This is idempotent on re-runs: a prior run's github_release
          # job may already have created the v<version> tag on the remote, which a tag-based build
          # (with fetch-depth: 0) would collide with — `fatal: tag already exists`. The authoritative
          # release tag is still created by the github_release job after a successful publish.
          POETRY_DYNAMIC_VERSIONING_BYPASS: ${{ needs.details.outputs.new_version }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: pypi
    needs: setup_and_build
    runs-on: ubuntu-latest
    environment:
      name: release-pypi
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # OIDC trusted publishing — no stored token. The runner mints a short-lived
      # OpenID Connect token (via `id-token: write`, above) that PyPI verifies against the
      # trusted publisher registered for this repo/workflow/environment, then issues a
      # one-time upload token for this run only. Requires a trusted publisher configured on
      # PyPI for owner=guilhermegor, repo=opendata-cvm, workflow=release-pypi.yaml,
      # environment=release-pypi. No PYPI_TOKEN secret is used.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create GitHub Release
    needs: [setup_and_build, details]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.details.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Name the artifacts; never glob `dist/*`. The repo tracks a 0-byte `dist/.keep` (see
      # .gitignore) so the directory ships with the scaffold, and it rides along in the artifact —
      # but GitHub's API REJECTS a 0-byte release asset ("size must be greater than or equal to 1").
      # action-gh-release@v1 ignored it; @v3 fails hard, and because @v3 creates the release as a
      # DRAFT and only promotes it after every upload succeeds, that failure left v0.25.4 published
      # on PyPI with NO git tag (GitHub creates no tag for a draft) — see #102. A build directory
      # holds build scaffolding by construction, so publish what we mean, not what happens to be
      # in the folder.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Publish the versioned docs with mike AFTER the PyPI publish succeeds — so the docs site only
  # ever documents a version that actually shipped. The deploy itself lives in its own reusable
  # workflow (deploy-docs.yaml) for organisation and so it can also be triggered manually; here we
  # just call it with the shipped version. Only stable releases move `latest`: a prerelease
  # (suffix like a1/b1/rc1) publishes to PyPI but must not become the default documented version.
  deploy_docs:
    needs: [details, pypi]
    if: needs.details.outputs.suffix == ''
    uses: ./.github/workflows/deploy-docs.yaml
    with:
      version: ${{ needs.details.outputs.new_version }}
    permissions:
      contents: write

  backfill_build:
    if: ${{ inputs.backfill }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Every Release Tag Under the New Name
        run: |
          python -m pip install --upgrade build
          old="filings-cvm"
          mkdir -p dist
          failed=()
          for tag in $(git tag --list 'v*' --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); do
            src=$(mktemp -d)
            git archive "$tag" | tar -x -C "$src"
            sed -i -E '0,/^name = ".*"/s//name = "'"$PACKAGE_NAME"'"/' "$src/pyproject.toml"
            { grep -rlE "[\"']${old}[\"']" "$src/src" || true; } | xargs -r sed -i -E "s/([\"'])${old}([\"'])/\1$PACKAGE_NAME\2/g"
            if POETRY_DYNAMIC_VERSIONING_BYPASS="${tag#v}" python -m build --outdir dist "$src" > "$src.log" 2>&1; then
              echo "built $tag"
            else
              echo "::warning::$tag did not build; skipped"; tail -20 "$src.log"; failed+=("$tag")
            fi
          done
          echo "Built $(find dist -name "*.whl" | wc -l) versions; skipped: ${failed[*]:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backfill-dist
          path: dist/

  backfill:
    needs: backfill_build
    runs-on: ubuntu-latest
    environment:
      name: release-pypi
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: backfill-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
